{% set name = "axopy" %}
{% set version = "0.2.3" %}
{% set sha256 = "f4bb344de40cdc94dc5386efccb3e675aa9395747cd407a4a152441855629354" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - pandas
    - h5py
    - pyqt>=5
    - pyqtgraph>=0.10

test:
  requires:
    - python {{ python_min }}
  imports:
    - axopy.features
    - axopy.gui
    - axopy.pipeline
    - axopy.task
    - axopy.daq
    - axopy.design
    - axopy.experiment
    - axopy.messaging
    - axopy.storage
    - axopy.timing
    - axopy.util

about:
  home: http://github.com/axopy/axopy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Human-computer interface experimentation library'

  doc_url: http://axopy.readthedocs.io/
  dev_url: https://github.com/axopy/axopy

extra:
  recipe-maintainers:
    - ixjlyons
